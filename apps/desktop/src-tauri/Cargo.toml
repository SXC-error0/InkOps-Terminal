[package]
name = "inkops-command"
version = "0.1.0"
description = "AI-Powered Indie Maker E-Ink Terminal - Desktop App"
authors = ["shixinchao"]
license = "MIT"
edition = "2021"
rust-version = "1.77.2"

[lib]
name = "app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.6.2", features = [] }

[dependencies]
log = "0.4"
serde_json = "1.0"
tauri = { version = "2.11.2", features = [] }
tauri-plugin-shell = "2"
