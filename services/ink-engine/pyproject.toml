[project]
name = "ink-engine"
version = "0.1.0"
description = "InkOps Terminal - Python AI Ink Engine Sidecar"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "sqlmodel>=0.0.22",
    "pydantic>=2.0",
    "pillow>=10.0",
    "qrcode>=7.4",
    "httpx>=0.27.0",
    "apscheduler>=3.10",
    "openai>=1.50.0",
    "python-dotenv>=1.0",
    "aiofiles>=24.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "httpx>=0.27.0",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"
